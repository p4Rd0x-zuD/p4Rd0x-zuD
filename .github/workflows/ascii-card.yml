name: ASCII profile card

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: hu553in/ascii-profile-card@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ascii-card
          config: |
            login: p4Rd0x-zuD
            uptimeStart: 2025-03-10

            art:
              seed: daily
              width: 480
              columns: 48
              rows: 20
              scale: 2.0
              warp: 1.5
              bands: 3.0
              contrast: 2.4
              octaves: 3

            ascii:
              flags: []

            card:
              align: left
              lowercase: false
              lines:
                - { type: header, text: 'p4Rd0x-zuD@github' }
                - { type: kv, key: Name, value: 'Julian Andres Pardo Hurtado' }
                - { type: kv, key: Role, value: 'Tecnólogo en Redes de Datos' }
                - { type: kv, key: Uptime, value: '{uptime}' }
                - { type: blank }
                - { type: section, title: Info }
                - { type: kv, key: Mindset, value: 'Curiosity, Initiative, Autonomy & Engineering Mindset' }
                - { type: kv, key: Focus, value: 'IA Agéntica · Automatizaciones · APIs · n8n' }
                - { type: kv, key: Achievement, value: '3° Lugar Nacional - Ciberseguridad (SenaSoft)' }
                - { type: kv, key: Graduation, value: 'Graduado 01 SEP 2026' }
                - { type: blank }
                - { type: kv, key: Contact, value: 'pardojulian189@gmail.com' }

            layout:
              charWidthPx: 9.5
              columnGapPx: 20
              cornerRadiusPx: 12
              fontFamily: "'JetBrains Mono', 'Cascadia Code', Consolas, monospace"
              fontSizePx: 14
              paddingPx: 16
              rowHeightPx: 18
              ruleWidth: 48
              valueColumn: 20

            output:
              dark: dark_mode.svg
              light: light_mode.svg

            themes:
              dark:
                background: '#161b22'
                text: '#c9d1d9'
                key: '#39FF14'
                value: '#a5d6ff'
                dots: '#616e7f'
                added: '#3fb950'
                deleted: '#f85149'
              light:
                background: '#f6f8fa'
                text: '#24292f'
                key: '#116329'
                value: '#0a3069'
                dots: '#9ba3ae'
                added: '#1a7f37'
                deleted: '#cf222e'
